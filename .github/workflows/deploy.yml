name: Java CI with Maven and Docker

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes e gerar cobertura
        run: mvn clean verify

      - name: Verificar cobertura JaCoCo
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: |
            tests/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          fail-build: true

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir e enviar imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-users:${{ github.sha }}

      - name: Atualizar container na AWS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          port: 22
          script: |
            docker stop user-service || true
            docker rm user-service --force || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-users:${{ github.sha }}
            docker run -d \
              --name user-service \
              --network rede \
              -p 8080:8080 \
              -e MONGODB_URI=mongodb://mongo-users:27017/plataforma-filmes \
              ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-filmes-users:${{ github.sha }}

